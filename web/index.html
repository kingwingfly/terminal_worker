<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><meta name="color-scheme" content="dark"><meta name="description" content="An R2 file terminal for media, presentations, and games."><title>R2 TERMINAL</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"></head>
<body><div id="app"><p class="loading">Connecting to terminal...</p></div><div id="dropzone" hidden>Save files to the current directory<span>Write using your current account permissions; up to 1 GB per file; interrupted uploads resume</span></div>
<dialog id="viewer" aria-labelledby="viewer-title"><div id="viewer-surface"><div class="viewer-bar"><div class="viewer-heading"><button id="viewer-back" aria-label="Back" hidden>←</button><span id="viewer-title"></span></div><div><a id="download" download>Download</a><button id="viewer-search" aria-label="Search the preview" title="Search · Ctrl+F" hidden>⌕</button><button id="fullscreen" aria-label="Fullscreen">⛶</button><button id="close-viewer" aria-label="Close preview">Close ×</button></div></div><div id="viewer-content"></div><p id="fullscreen-error" role="status" hidden></p></div></dialog>
<dialog id="auth" aria-labelledby="auth-title"><form id="auth-form"><span class="eyebrow">WRITE ACCESS</span><h2 id="auth-title">Sign in</h2><p id="auth-description">Access files using your account permissions.</p><div id="username-field"><label for="username">Username</label><input id="username" type="text" autocomplete="username" value="root"></div><div id="current-password-field" hidden><label for="current-password">Current password</label><input id="current-password" type="password" autocomplete="current-password"></div><label id="password-label" for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><div id="confirm-password-field" hidden><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password"></div><p id="auth-error" role="alert"></p><div class="auth-actions"><button type="button" id="cancel-auth">Cancel</button><button type="submit" class="primary">Unlock →</button></div></form></dialog>
<dialog id="editor" aria-labelledby="editor-title"><div class="editor-bar"><div><span class="eyebrow">VIM / EDITOR</span><strong id="editor-title"></strong><span id="editor-dirty" role="status"></span></div><button id="editor-close" aria-label="Close editor">Close ×</button></div><div id="editor-body"></div><div class="editor-footer"><span id="editor-status" role="status"></span><div><button id="editor-discard" hidden>Discard changes</button><button id="editor-download">Download draft</button><button id="editor-save" class="primary">Save Cmd / Ctrl S</button></div></div></dialog>
<script type="module">import { ready } from '/bridge.js'; import init from '/pkg/frontend.js'; ready.then(() => init()).catch(error => { document.getElementById('app').textContent = 'Terminal failed to load. Refresh to try again.'; console.error(error); });</script></body></html>
