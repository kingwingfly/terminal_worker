[package]
name = "terminal-worker-ui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "=0.8.20", features = ["csr"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures = "=0.4.79"
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "CustomEvent",
    "Document",
    "DomRectReadOnly",
    "Element",
    "Event",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "ImageData",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "IntersectionObserverInit",
    "KeyboardEvent",
    "MessageEvent",
    "MouseEvent",
    "Node",
    "NodeList",
    "Range",
    "ResizeObserver",
    "ResizeObserverEntry",
    "Selection",
    "Storage",
    "Url",
    "Window",
    "Worker",
] }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
gloo-net = "0.6"
terminal-worker-core = { path = "../core" }
console_error_panic_hook = "0.1"
# Pipelines run commands that run commands (xargs, fd -x), and wait for answers to prompts.
futures = "0.3"
# The viewer's search, with the regular expressions grep takes.
regex = { version = "1.13", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
# Uploads hash files, to resume them and so that R2 checks every chunk.
sha2 = "0.10"
# File previews: sanitized Markdown with maths as MathML, CSV tables, and ZIP and tar listings; PDF
# pages, diagrams and highlighted code come from the preview workers.
ammonia = "4.2"
csv = "1.4"
flate2 = "1.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
pulldown-latex = "0.8"
tar = { version = "0.4", default-features = false }
terminal-worker-preview = { path = "../preview" }
zip = { version = "9.1", default-features = false }
