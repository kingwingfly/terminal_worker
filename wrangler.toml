name = "terminal-worker"
main = "crates/worker/build/index.js"
compatibility_date = "2026-10-24"

[build]
command = "worker-build --release"
cwd = "crates/worker"
watch_dir = ["crates/worker/src", "crates/core/src"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "terminal-worker-files"

[[unsafe.bindings]]
name = "LOGIN_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[dev]
local_protocol = "http"
port = 8787

[[durable_objects.bindings]]
name = "AUTHORITY"
class_name = "TerminalAuthority"

[[migrations]]
tag = "v1-users-permissions"
new_sqlite_classes = ["TerminalAuthority"]

# Archive jobs (zip, unzip, tar): one ArchiveRunner Durable Object, and its container, a job.
[[durable_objects.bindings]]
name = "ARCHIVES"
class_name = "ArchiveRunner"

[[migrations]]
tag = "v2-archive-runner"
new_sqlite_classes = ["ArchiveRunner"]

[[containers]]
class_name = "ArchiveRunner"
image = "./containers/archiver/Dockerfile"
image_build_context = "."
instance_type = "basic"
max_instances = 4
