name = "terminal-worker"
main = "crates/worker/build/index.js"
compatibility_date = "2026-10-24"

[build]
command = "worker-build --release"
cwd = "crates/worker"
watch_dir = ["crates/worker/src", "crates/core/src"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "FILES"
bucket_name = "terminal-worker-files"

[[unsafe.bindings]]
name = "LOGIN_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[dev]
local_protocol = "http"
port = 8787

[[durable_objects.bindings]]
name = "AUTHORITY"
class_name = "TerminalAuthority"

[[migrations]]
tag = "v1-users-permissions"
new_sqlite_classes = ["TerminalAuthority"]

# Jobs (zip, unzip, tar, faststart): one JobRunner Durable Object, and its container, a job.
[[durable_objects.bindings]]
name = "JOBS"
class_name = "JobRunner"

[[migrations]]
tag = "v2-job-runner"
new_sqlite_classes = ["JobRunner"]

[[containers]]
class_name = "JobRunner"
image = "./containers/jobs/Dockerfile"
image_build_context = "."
instance_type = "basic"
max_instances = 4
